<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body class="eg-stage">
<div class="eg-stack">
  <div class="eg-row">
    <button class="eg-btn eg-btn--primary eg-btn--lg"><span data-icon="bolt" data-size="18"></span>Set up auto-trading</button>
    <button class="eg-btn eg-btn--primary"><span data-icon="bolt" data-size="16"></span>Calculate savings</button>
    <button class="eg-btn"><span data-icon="save" data-size="16"></span>Save to DB</button>
    <button class="eg-btn eg-btn--ghost"><span data-icon="sliders" data-size="16"></span>Parameters</button>
  </div>
  <div class="eg-row">
    <button class="eg-btn eg-btn--solid"><span data-icon="download" data-size="16"></span>Download bundle (.zip)</button>
    <button class="eg-btn eg-btn--accent">Place bid</button>
    <button class="eg-btn eg-btn--sm"><span data-icon="download" data-size="15"></span>Export PNG</button>
    <button class="eg-btn eg-btn--sm eg-btn--ghost">Cancel</button>
    <button class="eg-btn" disabled>Bid window closed</button>
  </div>
</div>
</body>
</html>
