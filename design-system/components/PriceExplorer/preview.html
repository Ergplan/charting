<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price explorer — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>.px { display: grid; gap: 20px; }</style>
</head>
<body class="eg-stage">
<div class="px"><div id="pl"></div><div id="pp"></div></div>
<script>
  var data = EnergyFlow.samplePriceYear();
  EnergyFlow.createPriceExplorer({
    landscape: '#pl', profile: '#pp', data: data, day: EnergyFlow.dayIndexOf(data, '2026-07-04'),
    landscapeOptions: { height: 380 }, profileOptions: { height: 380 }
  });
</script>
</body>
</html>
