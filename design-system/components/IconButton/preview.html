<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body class="eg-stage">
<div class="eg-row" style="gap:14px">
  <button class="eg-icon-btn" aria-label="Back"><span data-icon="arrow-left" data-size="20"></span></button>
  <button class="eg-icon-btn" aria-label="Comment"><span data-icon="message" data-size="20"></span></button>
  <button class="eg-icon-btn" aria-label="Report"><span data-icon="file" data-size="20"></span></button>
  <button class="eg-icon-btn" aria-label="Download"><span data-icon="download" data-size="20"></span></button>
  <button class="eg-icon-btn" aria-label="Notifications"><span data-icon="bell" data-size="20"></span><span class="eg-icon-btn__badge"></span></button>
  <button class="eg-icon-btn eg-icon-btn--accent" aria-label="Auto-trading"><span data-icon="bolt" data-size="20"></span></button>
  <button class="eg-icon-btn eg-icon-btn--sm" aria-label="Previous day"><span data-icon="chevron-left" data-size="18"></span></button>
  <button class="eg-icon-btn eg-icon-btn--sm" aria-label="Next day"><span data-icon="chevron-right" data-size="18"></span></button>
  <button class="eg-icon-btn eg-icon-btn--sm eg-icon-btn--solid" aria-label="Send"><span data-icon="arrow-up" data-size="18"></span></button>
</div>
</body>
</html>
