d" data-size="14"></span>IEX —</span></span><span class="eg-plant__foot"><span>Uttar Pradesh</span><span class="eg-chip"><span class="eg-dot eg-dot--off"></span>Auto: OFF</span></span></button><button class="eg-plant" aria-pressed="false"><span class="eg-plant__head"><span class="eg-plant__icon"><span data-icon="factory" data-size="20"></span></span><span><span class="eg-plant__name">Haldiram B2</span><span class="eg-plant__loc"><span data-icon="pin" data-size="13"></span>Noida</span></span><span class="eg-plant__radio"></span></span><span class="eg-plant__stats"><span class="eg-plant__cap"><span data-icon="bolt" data-size="16"></span>2 MW</span><span class="eg-plant__iex"><span data-icon="trend" data-size="14"></span>IEX —</span></span><span class="eg-plant__foot"><span>Uttar Pradesh</span><span class="eg-chip"><span class="eg-dot eg-dot--off"></span>Auto: OFF</span></span></button></div>
